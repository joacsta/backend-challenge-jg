services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wagering
      POSTGRES_PASSWORD: wagering
      POSTGRES_DB: wagering
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wagering -d wagering"]
      interval: 5s
      timeout: 3s
      retries: 10

  ministack:
    image: ministackorg/ministack
    ports:
      - "4566:4566"

volumes:
  pgdata:
